name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {java: '21', spigot: '1.21.11'}
          - {java: '25', spigot: '1.21.11'}
          - {java: '25', spigot: '26.1'}
          - {java: '25', spigot: '26.1.1'}
          - {java: '25', spigot: '26.1.2'}
          - {java: '25', spigot: '26.2'}
          - {java: '25', spigot: '26.3'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress -Dspigot.version=${{ matrix.spigot }}-R0.1-SNAPSHOT verify
      - uses: actions/upload-artifact@v4
        with:
          name: BlocksRegenerator-Spigot-${{ matrix.spigot }}-Java-${{ matrix.java }}
          path: target/BlocksRegenerator-*.jar
          if-no-files-found: error
