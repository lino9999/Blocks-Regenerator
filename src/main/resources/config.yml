generate-global-regions: false
persistent-timers: true
storage:
  autosave-seconds: 30
engine:
  max-operations-per-tick: 500
hooks:
  anti-grief:
    enabled: true
    ignore-op: true
    bypass-permission: blocksregenerator.bypass.claims
advanced:
  regen-delay:
    expression: "rUni(%min_delay%, %max_delay%)"
  region-edges:
    render-radius: 40
    render-interval: 10
  alternatives:
    auto-inventory: false
  stacked-blocks:
    fire-break-events: true
  converters:
    ultimate-regen:
      enabled: false
      remove-data: false
    minexfarm-regen:
      enabled: false
      remove-data: false
